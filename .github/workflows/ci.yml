name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand against a chosen ref. A push event is delivered once and is
  # not redelivered, so a commit whose delivery was dropped -- a webhook
  # throttled during a platform incident, most of all -- otherwise has no way to
  # be checked short of pushing another commit for the sole purpose of
  # triggering one.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; the guide's deploy job asks for what it needs.
permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (pinned)
        # rust-toolchain.toml pins the toolchain and its components, so fmt,
        # clippy, and the build all run under the same rustfmt everywhere.
        # This provisions that toolchain; every cargo call below selects it.
        run: rustup show
      - name: Cache the dependency build
        # Keyed on the lockfile and the job, so a job reuses only its own
        # feature selection's artifacts and a dependency change invalidates
        # them. The workspace's own crates are never cached.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Idiom census
        # Some concepts have one answer in this workspace and are meant to keep
        # having one, and a second implementation is neither a compile error nor
        # something a reviewer reliably catches. tools/idioms.toml records where
        # each appears; this fails on any difference, so a new site arrives as a
        # decision in the diff rather than as drift. Needs tomllib, so Python
        # 3.11 or newer -- the runner image is well past that.
        run: python3 tools/check-idioms.py
      - name: Provisioning seam
        # The three userlands sit on the `provision` seam, and whether they ever
        # become crates of their own is a decision for later. What keeps that
        # decision cheap is that a layer reaches only through the seam;
        # tools/seam.toml records every name that does not, with what it would
        # cost, and this fails on any difference.
        run: python3 tools/check-seam.py
      - name: Command-line parity
        # `fcage` claims to spell the launch builder's whole surface, and the
        # CLI's own tests cannot check that: they read its flag table, so a
        # library method absent from the table is absent from both sides.
        # tools/parity.toml records every public builder setting against the
        # flag that reaches it or the reason it has none, and this fails on any
        # difference.
        run: python3 tools/check-parity.py
      - name: Check (default features)
        run: cargo check --workspace --all-targets
      - name: Enable the sandbox facilities
        # Provision everything the security-property tests need, so their
        # REQUIRE guards below assert real enforcement rather than silently
        # skipping. Each command tolerates a runner that already has the
        # facility. Landlock and seccomp are kernel features present on the
        # runner's kernel and need no setup.
        run: |
          # Ubuntu 23.10+ restricts unprivileged user namespaces via AppArmor;
          # lift the restriction so the sandbox tests can run. The sysctl is
          # absent on other hosts, which is fine.
          sudo sysctl --ignore --write kernel.apparmor_restrict_unprivileged_userns=0 || true
          # /dev/net/tun for the native network-stack tests.
          sudo modprobe tun || true
          # The subordinate-id delegate for the range-map tests: the shadow
          # helpers and an allocation for the test-running user. The runner
          # image already grants this user a subordinate range, and appending a
          # second one would leave two ranges that can overlap -- which the
          # library refuses, correctly, as an invalid map. Declare exactly one
          # range instead, so the tests run against a known allocation whatever
          # the image happened to hand out.
          sudo apt-get update
          sudo apt-get install -y uidmap
          user="$(id -un)"
          printf '%s:500000:65536\n' "$user" | sudo tee /etc/subuid > /dev/null
          printf '%s:500000:65536\n' "$user" | sudo tee /etc/subgid > /dev/null
      - name: Test
        # Each REQUIRE turns a test's explicit skip into a failure, so a run
        # where a security-property suite silently skipped must not pass. They
        # assume the capable runner provisioned above.
        run: cargo test --workspace --all-features
        env:
          FERRODAY_CAGE_REQUIRE_USERNS: '1'
          FERRODAY_CAGE_REQUIRE_SUBID: '1'
          FERRODAY_CAGE_REQUIRE_TUN: '1'
          FERRODAY_CAGE_REQUIRE_OVERLAY: '1'
          FERRODAY_CAGE_REQUIRE_LANDLOCK: '1'
          FERRODAY_CAGE_REQUIRE_SECCOMP: '1'
          # The scope tests need Landlock ABI 6 (Linux 6.12). The hosted image
          # behind `ubuntu-latest` runs a 6.17 kernel on Ubuntu 24.04 and 7.0 on
          # 26.04, which the label is moving to, so a skip here is a regression
          # rather than an old host. A self-hosted runner on an older kernel
          # unsets this.
          FERRODAY_CAGE_REQUIRE_LANDLOCK_SCOPE: '1'
      - name: Test (serde without hardening)
        # A profile format built without the hardening layer must refuse a
        # profile that configures hardening; only this feature combination
        # compiles that path.
        run: cargo test -p ferroday-cage --features serde
      - name: Documentation (warning-clean)
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Documentation (default features, warning-clean)
        # The crate documents its feature-gated sections behind the feature,
        # so a no-feature build is warning-clean too, not only the all-features
        # one above. Scoped to the library: `--workspace` would build the CLI,
        # which enables every feature, and unification would then document the
        # library with them all on — the opposite of what this step tests.
        run: cargo doc -p ferroday-cage --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (pinned)
        run: rustup show
      - name: Cache the dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-hack
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack@0.6.45
      - name: Check the featureless build
        # The library has no default features, so this is the build a consumer
        # gets from a bare dependency line. Nothing else in CI covers it: every
        # other step is a workspace build, where the CLI's feature selection
        # unifies onto the library.
        run: cargo check -p ferroday-cage --no-default-features
      - name: Check the featureless build's targets
        # The same selection with the tests and examples. The testkit enables
        # none of this crate's features, so the library is still built with
        # none: the targets compiled are the ones that require nothing, and the
        # featureless half of a partly gated test such as
        # tests/debug_rendering.rs is compiled here and nowhere else. A test or
        # example that reaches for a feature without declaring it fails here.
        run: cargo check -p ferroday-cage --no-default-features --all-targets
      - name: Check the feature powerset
        # Depth 2 keeps the matrix small while covering the pairwise
        # interactions that actually break — `serde` without `hardening` is the
        # shape of problem this catches generally. A combination that stops
        # compiling is a breaking change for whoever selected it.
        #
        # `--no-dev-deps` is what makes each combination *be* that combination:
        # with the dev-dependencies in, every one of them would additionally
        # carry whatever the test fixtures need, and a library item reachable
        # only through that addition would compile here and fail for the
        # consumer who selected the combination on its own.
        #
        # `-D warnings`, as the all-features clippy step has. The warning it
        # asserts on is `dead_code`, and this is the only step that can see it:
        # an item every combination but one has a caller for compiles clean
        # under `--all-features` and is dead for whoever selected that one, so a
        # step that printed the warning rather than failing on it left the class
        # to be noticed by a reader.
        env:
          RUSTFLAGS: -D warnings
        run: cargo hack check -p ferroday-cage --feature-powerset --depth 2 --no-dev-deps
      - name: Check the feature powerset's targets
        # The same matrix over the tests and examples. A test target declaring
        # `required-features` still compiles under a combination that satisfies
        # them, so one reaching past what it declared is invisible to an
        # ordinary package check and to every all-features command a contributor
        # runs locally. The dev-dependencies add no feature of this crate's, so
        # each combination here is exactly the one named.
        env:
          RUSTFLAGS: -D warnings
        run: cargo hack check -p ferroday-cage --feature-powerset --depth 2 --all-targets
      - name: Document the feature powerset
        # The same matrix over rustdoc, because a doc link is resolved against
        # the items a combination actually compiles. A link from shared code to
        # a feature-gated item resolves under `--all-features` and under nothing
        # else, so the docs job cannot see it and neither can a contributor
        # building the guide. Where a sentence genuinely names items from two
        # features, it is written per combination with `cfg_attr(..., doc = ...)`
        # and this step is what holds each spelling to a build that has them.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo hack doc -p ferroday-cage --feature-powerset --depth 2 --no-deps --no-dev-deps

  api:
    name: Public API surface
    runs-on: ubuntu-latest
    env:
      # cargo-public-api reads rustdoc's JSON output, and how that renders
      # standard-library paths changes between nightlies: an in-progress
      # core::io restructuring, for one, spells std::io::Write as
      # core::io::write::Write in emitted signatures. A floating nightly would
      # therefore fail this gate on rustdoc drift rather than on the API change
      # it exists to catch, which is how a gate gets trained out of. Pin it,
      # and bump deliberately -- a bump regenerates the snapshot, and that diff
      # is reviewed like any other.
      RUSTDOC_JSON_NIGHTLY: nightly-2026-07-09
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (pinned, plus the pinned nightly for rustdoc JSON)
        run: |
          rustup show
          rustup toolchain install "$RUSTDOC_JSON_NIGHTLY" --profile minimal
      - name: Cache the dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-public-api
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-public-api@0.52.0
      - name: Regenerate the snapshot
        # Auto-trait impls are kept in the snapshot on purpose: it records both
        # `impl Send for Cage` and `!Send for Running<'obs>`, so an auto trait
        # gained or lost shows up in review. Blanket and auto-derived impls are
        # omitted as noise.
        run: |
          RUSTUP_TOOLCHAIN="$RUSTDOC_JSON_NIGHTLY" cargo public-api -p ferroday-cage --all-features \
            --omit blanket-impls,auto-derived-impls \
            > crates/ferroday-cage/public-api.txt
      - name: Fail on an unreviewed surface change
        # The snapshot is committed, so any change to the public API — a new
        # item, a moved path, an appearing re-export — arrives as a reviewable
        # diff rather than passing unnoticed. Regenerate with the command above
        # and commit the result.
        run: git diff --exit-code -- crates/ferroday-cage/public-api.txt

  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The baseline is the newest release tag, so this job needs the
          # history and its tags rather than the single commit a checkout
          # fetches by default.
          fetch-depth: 0
      - name: Install Rust (pinned)
        run: rustup show
      - name: Cache the dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-semver-checks@0.50.0
      - name: Document the last release and the tree, each from its own lockfile
        # The baseline is the newest `v*` tag reachable from the commit before
        # this one: the release this change would follow, and on a release
        # commit itself the release before it.
        #
        # Both sides are built here, from source, with `--locked`, rather than
        # left to cargo-semver-checks. Given a registry version or a revision,
        # it resolves the baseline's dependencies afresh, so a dependency's own
        # later release can stop a published baseline compiling at all and turn
        # this job red for a reason that is not this crate's API. The tag
        # carries the lockfile it was released with, and building from it keeps
        # the comparison about this crate.
        #
        # `--all-features`, as the API snapshot above takes it and for the same
        # reason: the crate declares no `default` feature, so without it the
        # compared surface is the featureless one and every item a feature gates
        # -- the provisioners, the hardening layer, the network stack -- is
        # outside the gate entirely. `RUSTC_BOOTSTRAP` is what lets the pinned
        # stable toolchain emit rustdoc's JSON, as cargo-semver-checks itself
        # does when it builds a side.
        env:
          RUSTC_BOOTSTRAP: '1'
        run: |
          baseline="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)"
          echo "Comparing against $baseline"
          mkdir -p "$RUNNER_TEMP/baseline"
          git archive "$baseline" | tar -x -C "$RUNNER_TEMP/baseline"
          cargo rustdoc --locked --manifest-path "$RUNNER_TEMP/baseline/Cargo.toml" \
            -p ferroday-cage --all-features --lib --target-dir "$RUNNER_TEMP/baseline-target" \
            -- -Z unstable-options --output-format json
          cargo rustdoc --locked -p ferroday-cage --all-features --lib \
            -- -Z unstable-options --output-format json
      - name: Check the tree against the last release
        # Fails on a breaking change the version number does not declare. The
        # verdict is relative to the workspace's `version`: while it still names
        # the last release, the tree is judged as a compatible release of it,
        # so a breaking change fails here with the items it breaks listed. That is the job
        # working, not noise. A failure names what the next release must
        # declare, and bumping the version to the next breaking release (0.4.x
        # to 0.5.0) is what turns it green. Read the listed items against the
        # changelog's **Breaking.** entries: every one should be there.
        run: |
          cargo semver-checks check-release \
            --baseline-rustdoc "$RUNNER_TEMP/baseline-target/doc/ferroday_cage.json" \
            --current-rustdoc target/doc/ferroday_cage.json

  deny:
    name: License and advisory policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check dependency licenses and advisories
        # deny.toml pins the permitted license set, the RUSTSEC advisory
        # policy, and the registries a dependency may come from; this fails the
        # build if a dependency enters the tree under an unlisted license, from
        # anywhere but crates.io, or carrying a known, unignored advisory.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories sources

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (MSRV)
        # An independent floor guard: the `+1.91` override wins over the pinned
        # toolchain, which sits ahead of the floor, so this checks the version
        # `rust-version` actually promises rather than the one contributors use.
        run: rustup toolchain install 1.91 --profile minimal
      # The cache key is derived from the job, so this job's artifacts — built
      # by the floor toolchain rather than the pinned one — stay in a cache of
      # their own without being told which toolchain they came from.
      - name: Cache the dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check
        run: cargo +1.91 check --workspace --all-targets --all-features

  book:
    name: Guide
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.4
      # The release asset's own digest, as GitHub records it for the release.
      MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (pinned)
        run: rustup show
      # No dependency cache in this job. What it builds is what `pages`
      # publishes, and a restored cache is compiled code the build would run:
      # the job pays for its own dependency build rather than trust one.
      - name: Install mdBook
        # Checked against the digest above before it is unpacked, so a
        # replaced release asset fails the job rather than building the site.
        run: |
          archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLf -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/$archive"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive"
      - name: Build
        # Rendering only: mdBook does not compile a code block. The guide's Rust
        # blocks are doctests of the library -- src/guide.rs includes every
        # chapter -- so the `cargo test` in the checks job is what holds them to
        # an API that still exists.
        run: ./mdbook build docs
      - name: Build the API documentation
        # The link check below resolves the guide's docs.rs URLs against this
        # output, so it has to exist first.
        run: cargo doc --workspace --all-features --no-deps
      - name: Check the guide's links
        # mdBook cannot check the guide's API links: they are absolute docs.rs
        # URLs, so to mdBook they are external and a renamed method leaves a
        # dangling link nothing notices. This resolves each one against the
        # rustdoc output, and each cross-chapter link (heading anchors
        # included) against docs/src.
        run: python3 docs/check-links.py
      - name: Package the guide
        # Uploaded on every run, so a pull request proves the artifact builds;
        # only the deploy job below publishes it, and only from main.
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/book

  pages:
    name: Publish the guide
    # The repository's homepage, and the target of every documentation link in
    # README.md, SECURITY.md, CONTRIBUTING.md, and CHANGELOG.md. Publishing
    # requires the repository's Pages source to be set to "GitHub Actions".
    #
    # A merged change publishes, as does a run started by hand against main; a
    # pull request builds and link-checks the guide in the job above without
    # touching the live site.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    needs: book
    runs-on: ubuntu-latest
    permissions:
      # `pages` to publish, `id-token` for the deployment's OIDC exchange.
      pages: write
      id-token: write
    # One deployment at a time, and never cancelled part way: a half-published
    # site is worse than a stale one.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
