# Primitives the workspace answers once, and the answer to reach for instead.
#
# An entry here belongs to a concept the code has consolidated: the second
# direct call is how that consolidation comes undone, and this is what makes
# the second call say so. The site that *is* the answer carries
# `#[allow(clippy::disallowed_methods)]`, and so does any site the answer
# genuinely does not cover -- each with a comment giving the reason, which is
# the convention `CONTRIBUTING.md` states for a second answer generally.
#
# The list is deliberately short. A ban is worth adding where a direct call is
# both tempting and subtly wrong on its own; where the concept is a shape rather
# than a call -- an `Instant` plus a `Duration`, a hand-split path -- clippy
# cannot see it, and `tools/check-idioms.py` is what watches instead.
disallowed-methods = [
  { path = "rustix::fs::openat2", reason = "open a directory contained in a tree through provision::containment::open_dir, which folds in the flags every caller passes and the retry the kernel asks for when a rename races the walk" },
  { path = "rustix::fs::flock", reason = "take a lock file through provision::lock_exclusive, which opens it close-on-exec without following a symlink and re-checks that the path still names the file it locked" },
  { path = "rustix::io::dup", reason = "duplicate a descriptor with rustix::io::fcntl_dupfd_cloexec, so the copy is close-on-exec like every other descriptor the library holds and a spawned process does not inherit it" },
  { path = "std::fs::remove_dir_all", reason = "remove a tree through provision::remove_tree (or provision::Remove), whose walk never recurses: a tree a sandbox wrote can nest deep enough to exhaust the descriptors or the stack a recursive removal holds per level" },
  { path = "rustix::fs::chmodat", reason = "a chmod by name follows a symbolic link at the leaf, and cannot be told not to: open the entry with O_NOFOLLOW (O_DIRECTORY for a directory, O_NONBLOCK for a named pipe) and fchmod the descriptor, as mechanism::child's create_mount_dir does; a chain of new directories is provision::containment::create_dirs" },
  { path = "rustix::fs::chmod", reason = "a chmod by path follows every symbolic link on it: open the entry with O_NOFOLLOW and fchmod the descriptor, as mechanism::child's create_mount_dir does" },
  { path = "rustix::rand::getrandom", reason = "fill a buffer through host::fill_random, which resumes a short read and cannot spin on an empty one; the caller keeps its own policy for a failure" },
]
