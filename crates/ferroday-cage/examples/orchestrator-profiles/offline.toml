# The "offline" group: a sandbox with no network at all, not even loopback,
# for hermetic work. It applies no hardening, so it is no boundary against
# hostile code; the guide's Hardening chapter covers what that takes. A command
# given on the prompt may be a bare name, found on the sandbox's PATH. Point
# --rootfs at a root filesystem you have, or edit the rootfs line below.
rootfs = "/srv/rootfs/alpine"
network = "none"
hostname = "offline"
workdir = "/tmp"
path-lookup = true

[env]
LANG = "C.UTF-8"
