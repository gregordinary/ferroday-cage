# The "net-dev" group: the host network shared into the sandbox, for commands
# that fetch from the network. The host's resolv.conf is bound in so DNS
# resolves. A command given on the prompt may be a bare name, found on the
# sandbox's PATH. Point --rootfs at a root filesystem you have.
rootfs = "/srv/rootfs/alpine"
network = "host"
hostname = "net-dev"
workdir = "/root"
path-lookup = true
