[package]
name = "ferroday-cage"
description = "Run a command inside an unprivileged Linux sandbox: fresh namespaces, a root filesystem you supply or bootstrap from Debian, Alpine, or Gentoo, and a clean environment, established in pure Rust against the kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
categories = ["os::linux-apis", "virtualization"]
keywords = ["sandbox", "rootless", "seccomp", "debootstrap", "alpine"]
# Test fixtures are host-and-feature-gated build inputs, and the public-API
# snapshot is a review artifact, not part of the published crate. Keep both out
# of the packaged tarball.
exclude = ["tests/fixtures", "public-api.txt"]

# docs.rs builds with default features only; the public API is spread across
# the optional features, so document them all. The `docsrs` cfg is set for
# per-item `#[doc(cfg(...))]` availability annotations, should they be added.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `rand` is the kernel's getrandom: the host probes name their scratch entries
# from it, and the native network stack seeds its TCP sequence numbers from it.
rustix = { version = "1.1.4", features = ["mount", "process", "fs", "pipe", "thread", "net", "system", "event", "stdio", "rand", "pty", "termios"] }
# A no_std, libc-free inline-assembly conduit for the syscalls rustix does not
# wrap for a program like this one: the launch's fork, exec, exit, and signal
# calls (core), mount_setattr, for recursively read-only bind mounts (core), and
# the Landlock and seccomp-install calls (the hardening layer). The crate owns
# the relevant uapi structs and issues the syscalls directly, so no `landlock`
# crate is needed.
syscalls = { version = "0.8", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true }
# gzip. The backend is named rather than left to flate2's default so that it
# cannot move without this line moving: `miniz_oxide` carries
# `#![forbid(unsafe_code)]`, which is the property being selected for, and a
# `tarball` build reaches gzip through this crate alone.
#
flate2 = { version = "1.1", optional = true, default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "0.24", optional = true, default-features = false, features = ["std", "xz"] }
# `hash` is what computes a frame's content checksum while it decodes, which the
# reader holds each frame to; named rather than left to the default features so
# the comparison cannot lose its other half without this line moving. 0.9.1 is
# the floor because 0.9.0 lets a block decode past `Block_Maximum_Size`, which
# the window cap does not bound (RUSTSEC-2026-0344).
ruzstd = { version = "0.9.1", optional = true, default-features = false, features = ["std", "hash"] }
# The Debian and Gentoo userland add-on: OpenPGP verification of the archive's
# signed documents (safe Rust, no dependencies), and the hashing their trust
# chains are defined over -- SHA-256 for Debian's release chain, SHA-512 for
# Gentoo's digest documents.
irongall = { version = "0.1", optional = true }
sha2 = { version = "0.11", optional = true }
# The Alpine userland add-on: RSA PKCS#1 v1.5 verification of the apk signature
# (pure Rust, no C backend) and the SHA-1 the apk v2 chain is defined over.
#
# `sha1`'s `oid` feature is not on by default and is required: the digest type
# reaches `Pkcs1v15Sign::new` for its DER prefix, not to hash.
rsa = { version = "0.9.10", optional = true, default-features = false, features = ["pem"] }
sha1 = { version = "0.10", optional = true, features = ["oid"] }
# The Gentoo binary-package add-on: the MD5 portage writes into its own package
# database -- an installed package's `CONTENTS` records one per file so portage
# can tell an edited file from a merged one, and its `BINPKGMD5` records the
# binary package's own. Bookkeeping rather than trust: nothing in this crate
# compares an MD5 to decide whether to accept bytes.
md-5 = { version = "0.10", optional = true }
# The hardening add-on: seccomp-BPF compilation, pure Rust (the syscall conduit
# it installs through is the always-present `syscalls` above).
seccompiler = { version = "0.5", optional = true }
# The native network stack: a userspace TCP/IP implementation, pure Rust with
# default features off, so no libc enters the graph. It terminates the
# sandbox's TCP and UDP flows against a tap device the library creates.
smoltcp = { version = "0.14", optional = true, default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "auto-icmp-echo-reply",
    "iface-max-addr-count-3",
] }

[features]
# Serialization of the sandbox specification, for profile files.
serde = ["dep:serde"]
# The tarball rootfs provisioner: tar extraction with gzip, xz, and zstd
# decoding, all pure Rust.
tarball = ["dep:flate2", "dep:lzma-rust2", "dep:ruzstd"]
# The Debian userland provisioner: bootstrap a suite/architecture rootfs and
# install packages, talking to the archive directly. Builds on the tarball
# extractor for the packages' data members.
debian = ["tarball", "dep:irongall", "dep:sha2"]
# The Alpine userland provisioner: bootstrap a release/architecture rootfs from
# an apk repository, and postmarketOS's repositories beside it. Builds on the
# tarball extractor for the packages' data segments.
alpine = ["tarball", "dep:rsa", "dep:sha1", "dep:sha2"]
# The Gentoo userland provisioner: bootstrap a rootfs from a signed stage3
# tarball. It selects the same dependencies the Debian layer does, which is what
# it costs to add: OpenPGP for the signed pointer and digest documents, and the
# SHA-512 those record. Builds on the tarball extractor for the stage3 itself.
gentoo = ["tarball", "dep:irongall", "dep:sha2", "dep:md-5"]
# The hardening layer: opt-in Landlock filesystem rules, seccomp syscall
# filters, and capability drops applied to the sandboxed command.
hardening = ["dep:seccompiler"]
# The native userspace network stack: outbound TCP and UDP connectivity for
# the isolated network namespace, with no external helper binary.
netstack = ["dep:smoltcp"]
# The subordinate-id delegate: establish uid/gid range maps through the
# shadow suite's setuid `newuidmap`/`newgidmap` helpers. The one feature
# that executes an external binary; a default build invokes none.
subid = []

[lints]
workspace = true

# The integration tests provision their rootfs fixture through the tarball
# provisioner, so every integration-test binary requires the feature.
[[test]]
name = "sandbox"
required-features = ["tarball"]

[[test]]
name = "overlay"
required-features = ["tarball"]

[[test]]
name = "process"
required-features = ["tarball"]

[[test]]
name = "streams"
required-features = ["tarball"]

[[test]]
name = "handle"
required-features = ["tarball"]

# The terminal tests launch real sandboxes against the rootfs fixture; the
# run-as case additionally needs a range-map delegate and is gated on `subid`
# within the binary.
[[test]]
name = "terminal"
required-features = ["tarball"]

# The relay tests drive interactive sessions against the rootfs fixture; the
# restriction case runs a host binary and is gated on `hardening` within the
# binary.
[[test]]
name = "relay"
required-features = ["tarball"]

[[test]]
name = "network_seam"
required-features = ["tarball"]

# The keyring tests launch a sandbox against the rootfs fixture; the
# restriction case runs a host shell and is gated on `hardening` within the
# binary.
[[test]]
name = "keyring"
required-features = ["tarball"]

[[test]]
name = "provision"
required-features = ["tarball"]

# The export tests fork a child that re-enters an identity map; the
# subordinate round-trip additionally needs a range-map delegate and the
# rootfs fixture, so its body is gated on `subid` within the binary.
[[test]]
name = "export"
required-features = ["tarball"]

[[test]]
name = "debian"
required-features = ["debian"]

# The Alpine bootstrap tests reach a live mirror and run the closure's install
# scripts in a cage, so every one of them is gated within the binary; the
# hermetic tests sit beside the code, with the committed archive fixtures.
[[test]]
name = "alpine"
required-features = ["alpine", "tarball"]

# The Gentoo tests read the live archive and download a half-gigabyte stage3,
# so every one of them is gated within the binary; the hermetic tests sit beside
# the code, over documents signed by a key the test generates.
[[test]]
name = "gentoo"
required-features = ["gentoo"]

# The native-stack tests additionally need a host with /dev/net/tun; they
# skip (explicitly, on stderr) where it is unavailable.
[[test]]
name = "netstack"
required-features = ["netstack", "tarball"]

[[test]]
name = "hardening"
required-features = ["hardening", "tarball"]

# The restriction fallback needs neither user namespaces nor a rootfs
# fixture: its tests run host binaries and require only the feature.
[[test]]
name = "restrict"
required-features = ["hardening"]

# The identity-map tests need the rootfs fixture; the range-map cases
# additionally need a working delegate on the host and skip (explicitly, on
# stderr) where none is available.
[[test]]
name = "identity"
required-features = ["tarball"]

# A worked consumer: a profile-driven, group-based sandbox orchestrator. It
# loads profiles through the `serde` feature, so it builds only when that
# feature is enabled.
[[example]]
name = "orchestrator"
required-features = ["serde"]

# A worked consumer: an ebuild development sandbox that provisions a Gentoo
# stage3 and builds packages in it under a subordinate uid/gid range map, so
# portage's own ids exist inside. It provisions the root through the Gentoo
# provisioner -- or from a tarball already on the host, through the tarball one
# `gentoo` implies -- and establishes the map through the subid delegate, so it
# builds only when both features are enabled.
[[example]]
name = "ebuild-sandbox"
required-features = ["gentoo", "subid"]

# A worked consumer: a Gentoo binary-package sandbox that provisions a stage3
# and installs prebuilt packages into it from the archive's binhost, then runs a
# command against the result. It provisions through the Gentoo provisioner, so
# it builds only when the `gentoo` feature is enabled.
[[example]]
name = "gentoo-binhost"
required-features = ["gentoo"]

# A worked consumer: a Debian source-package build sandbox that bootstraps a
# suite with build tooling and builds a .deb from source. It provisions the
# root through the Debian provisioner, so it builds only when the `debian`
# feature is enabled.
[[example]]
name = "deb-build"
required-features = ["debian"]

# A worked consumer: a foreign-architecture build-and-test sandbox that
# bootstraps a Debian root for an architecture the host cannot execute and
# compiles and runs a C program inside it, through the qemu-user binfmt handler.
[[example]]
name = "cross-arch-test"
required-features = ["debian", "hardening"]

# A worked consumer: a multi-repository provisioning sandbox that bootstraps a
# root from the archive mirror plus local trusted repositories. It exercises the
# Debian provisioner's repository builder, so it builds only when the `debian`
# feature is enabled.
[[example]]
name = "deb-multirepo"
required-features = ["debian"]

# A worked consumer: a layered, multi-component build pipeline that provisions
# one base, stages each component's build dependencies over it as a disposable
# overlay layer, and feeds each built package into the next through a local pool.
# It exercises the Debian provisioner's layered build path and pool writer, so it
# builds only when the `debian` feature is enabled.
[[example]]
name = "deb-layer-pipeline"
required-features = ["debian"]

# A worked consumer: a fetch sandbox that provisions an Alpine root and runs
# wget through the native network stack. It provisions through the tarball
# provisioner and attaches the stack, so it builds only when both the
# `netstack` and `tarball` features are enabled.
[[example]]
name = "fetch-sandbox"
required-features = ["netstack", "tarball"]

# A worked consumer: a C build sandbox that provisions an Alpine root with the
# toolchain and links a source tree statically against musl, reporting whether
# each artifact really came out static. It provisions through the Alpine
# provisioner, so it builds only when the `alpine` feature is enabled.
[[example]]
name = "musl-build"
required-features = ["alpine"]

[dev-dependencies]
# The workspace's shared test fixtures and harnesses: the root filesystem, the
# scratch directories, the skip rule, the tar, `ar`, and repository builders,
# and the pseudoterminal harness. It never ships, and none of its features
# enables one of this crate's, so a test target compiles under exactly the
# features its command line and its `required-features` select.
ferroday-cage-testkit = { path = "../ferroday-cage-testkit", features = ["hex", "pty"] }
toml = "1.1"
# The hardening tests name syscalls and signals by their libc constants.
libc = "0.2"
# The provisioning tests generate compressed fixtures.
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz", "encoder"] }
# The signature tests generate throwaway signing keys and sign documents with
# them, to exercise the verification path adversarially: irongall verifies but
# cannot sign. rPGP signs, with the RNG it needs.
pgp = { version = "0.21", default-features = false }
rand = "0.8"
