[package]
name = "ferroday-cage-testkit"
description = "Test fixtures shared by the ferroday-cage workspace's tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never published: it exists so the two crates' test suites share one rootfs
# fixture, one skip rule, one tar writer, one terminal harness, and one hex
# encoder rather than keeping a copy each. Nothing here ships.
publish = false

[dependencies]
# No library feature is requested, here or by any feature below: Cargo resolves
# a dev-dependency's features once for every test and example, so one that
# reached the library would reach every test build of it. A fixture that needs
# a library feature takes that part from its caller instead; the crate
# documentation says which.
ferroday-cage = { path = "../ferroday-cage", default-features = false }
sha2 = { version = "0.11", optional = true }
# The process helpers wait for a child without reaping it and end a bounded run
# by its process group, a test waits on a descriptor through `poll`, a probe
# closes its standard descriptors and puts them back, and a test sets and reads
# extended attributes; the pseudoterminal harness takes the rest.
rustix = { version = "1.1.4", features = ["event", "fs", "process", "stdio"] }

[features]
# SHA-256 hex digests, and the Debian fixture repository whose index states
# them.
hex = ["dep:sha2"]
# The pseudoterminal harness: allocating a pair, starting a process with one as
# its controlling terminal, and reading it against a deadline.
pty = ["rustix/event", "rustix/pty", "rustix/stdio", "rustix/termios"]

[lints]
workspace = true
