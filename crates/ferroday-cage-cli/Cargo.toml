[package]
name = "ferroday-cage-cli"
description = "Run a command inside an unprivileged Linux sandbox from a shell prompt: fresh namespaces, a root filesystem you supply or bootstrap from Debian, Alpine, or Gentoo, seccomp and Landlock hardening, and a clean environment. Installs the fcage binary"
# `fcage` versions independently of the library. Its compatibility contract is
# its flags, exit codes, and output format, which a library release does not
# necessarily change — and a library release that does break its own API need
# not break the CLI's.
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
categories = ["command-line-utilities", "os::linux-apis", "virtualization"]
keywords = ["sandbox", "rootless", "chroot", "debootstrap", "alpine"]
# The integration tests drive the built binary against the library crate's
# rootfs fixture, which they reach by workspace-relative path. They cannot run
# from a published tarball, where that path does not exist, so they are not part
# of it.
exclude = ["tests"]

[[bin]]
name = "fcage"
path = "src/main.rs"

[dependencies]
# Every feature the library offers, so `fcage` is the whole library at a shell
# prompt: a profile or flag that names any capability works rather than being
# refused by a binary built without it. `subid` is included for that reason —
# it is the one feature that executes an external binary (the shadow suite's
# newuidmap/newgidmap), and only when a run asks for a subordinate map.
ferroday-cage = { version = "0.4.4", path = "../ferroday-cage", features = ["serde", "tarball", "debian", "alpine", "gentoo", "hardening", "netstack", "subid"] }
toml = "1.1"
# Resolves a `--rlimit` resource name through the library's own `Deserialize`,
# so the flag and a profile's `[rlimit]` keys cannot drift apart.
serde = "1.0"
# Resolves seccomp syscall names to numbers for the host architecture, the
# same crate and native table the library uses.
syscalls = { version = "0.8", default-features = false }
# The two ambient readings `--terminal` makes of the terminal `fcage` was
# started from: whether it is one, and what size it reports. The relay itself is
# the library's, and needs nothing here. `event` is the poll the stream relays
# wait in, for a standard stream that is a file.
rustix = { version = "1.1.4", features = ["stdio", "termios", "event"] }

[dev-dependencies]
# The workspace's shared test fixtures. The relay's tests need the rootfs and a
# pseudoterminal reader; nothing here builds a Debian fixture.
ferroday-cage-testkit = { path = "../ferroday-cage-testkit", features = [
    "tarball",
    "pty",
] }
# The relay's integration tests drive the built binary through a pseudoterminal
# of their own, which is the only way to reach raw mode, the size copy, and the
# restoration. `pty` is needed for that and by nothing the binary does.
rustix = { version = "1.1.4", features = ["pty"] }

[lints]
workspace = true
