# What each userland reaches for outside the provisioning seam.
#
# `provision` is the seam three archive layers sit on: the `Provisioner` trait,
# `Fetch`, `ProvisionError`, `BuildLayer`, and the shared tar, compress,
# extract, digest, document and OpenPGP machinery. A layer reaching only
# through it is a layer that could be its own crate; every other name it uses
# is a thing that would have to move, be re-exported, or become public first.
#
# This file is that list. `tools/check-seam.py` compares it against the tree and
# fails on any difference, which makes each reach past the seam a decision in a
# diff rather than one nobody made. It is not a ban: several of these are the
# library's own public API, which a separate crate would depend on anyway.
#
# `kind` says what a reach costs if the layers ever move out:
#
#   public    Already public API. A separate crate would depend on this crate
#             and use exactly this name.
#   internal  Not public. Moving the layer means making it public, moving it,
#             or writing the layer a copy.

[[layer]]
name = "debian"

[[layer.reach]]
name = "Error"
count = 3
kind = "public"
why = "A launch failure, wrapped as `DebianError::Launch`."

[[layer.reach]]
name = "IdentityMap"
count = 2
kind = "public"
why = """\
The map the builder takes and the bootstrap's own cages run under, imported \
once by the layer and once by its bootstrap."""

[[layer.reach]]
name = "IdMapper"
count = 2
kind = "public"
why = """\
The delegate the builder takes for that map and hands each of the bootstrap's \
cages, imported once by the layer and once by its bootstrap."""

[[layer.reach]]
name = "Observer"
count = 1
kind = "public"
why = "The observer dpkg's output reaches the layer's own events through."

[[layer.reach]]
name = "Stdio"
count = 1
kind = "public"
why = "`Stdio::Null`, the standard input a package script's cage runs with."

[[layer.reach]]
name = "host"
count = 1
kind = "public"
why = "`host::overlay_blocker`, the preflight a layered build makes."

[[layer.reach]]
name = "status"
count = 1
kind = "public"
why = "`ExitStatus`, the outcome a dpkg wave reports."

[[layer.reach]]
name = "idmap"
count = 2
kind = "internal"
why = """\
`idmap::establishable`, the preflight that refuses an unavailable or malformed \
range map, through the caller's delegate or the bundled chain, before anything \
is downloaded. Nothing public answers the question."""

[[layer.reach]]
name = "ErrorChain"
count = 2
kind = "public"
why = """\
The renderer that flattens one of the crate's own errors into a reason with \
its causes: an index that does not decompress, a `.deb` the pool cannot read, \
and a range map no delegate can establish."""

[[layer.reach]]
name = "failure"
count = 1
kind = "internal"
why = "`failure::path_io_error!`, which declares the layer's `io` and `at` constructors."

[[layer.reach]]
name = "roster"
count = 1
kind = "internal"
why = "`roster::roster_enum!`, which declares `Priority` and its roster."

[[layer.reach]]
name = "path"
count = 1
kind = "internal"
why = """\
`path::parent_of`, the directory beside a build layer's upper that the overlay \
preflight probes, where `Path::parent` would answer a bare name with the empty \
path."""

