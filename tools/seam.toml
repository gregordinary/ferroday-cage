# The boundary between the userland side of `provision` and the rest of the crate.
#
# The userland side is the three archive layers and the archive machinery only
# they use. A crate of its own could reach the rest of this crate through its
# public API and nothing else, so every item it reaches that is not public API is
# recorded here, with what that would cost. `tools/check-seam.py` compares this
# file against the tree and fails on any difference, which makes each reach a
# decision in a diff rather than one nobody made, and records the one that goes
# away in the change that removed it.
#
# `code` counts the paths the userland side's code spells to the item; `tests`
# counts those its tests spell. A method called on a value and a field are not
# paths, so an entry names the type they belong to.
#
# `cost` is one of:
#
#   share    Part of machinery the rest of the crate uses too. It would be
#            public API, or live where both sides could reach it.
#   move     Only the userland side uses it. It would go with the userland side.
#   copy     A small, pure unit both sides use. Each side would keep its own
#            copy, held identical.
#   reroute  Public API already reaches the same thing by another path.
#   test     A test's helper. It would go to `ferroday-cage-testkit`.

# The modules of `provision` on the userland side.
userland = [
    "alpine",
    "available",
    "binfmt",
    "cache",
    "coordinate",
    "debian",
    "digest",
    "document",
    "fetch",
    "gentoo",
    "http",
    "layer",
    "layer_error",
    "observe",
    "openpgp",
    "settings",
]

# The three formats, which never name each other in code.
layers = ["alpine", "debian", "gentoo"]

