[[idiom]]
name = "a write whose zero-byte case is decided inline"
# Anchored on the `match` over a write with an `Ok(0)` arm directly under it,
# which is what a hand-rolled short-write loop looks like whatever it does with
# the zero.
pattern = 'io::write\([^\n]*\) \{\n\s+Ok\(0\)'
answer = """\
`mechanism::frame::write_full`, which loops over short writes, retries `EINTR`, \
and reports a zero-byte write on a descriptor that is neither full nor closed \
as the anomaly it is. The vocabulary table listed `mechanism::frame` as the \
framed protocol between a helper child and its caller, which did not advertise \
that its byte-level readers and writers are reusable on their own -- and a \
review found the relay had written a second one."""

[[idiom.site]]
path = "crates/ferroday-cage/src/mechanism/frame.rs"
count = 1
why = "The answer."

[[idiom.site]]
path = "crates/ferroday-cage/src/relay/mod.rs"
count = 1
why = """\
The relay's sandbox-bound direction, which is not a short-write loop at all: \
the primary is non-blocking and what it will not take waits in a pending buffer \
behind `POLLOUT`, so a zero here means "no more for now" and the loop returns \
rather than treating it as an anomaly or spinning on it. The caller-bound \
direction, which *is* the loop, reaches for the answer."""

[[idiom]]
name = "portage's database directory, spelled out"
pattern = '"var/db/pkg"'
answer = """\
`provision::gentoo::DB_DIR`. The pair that must agree is the writer and the \
reader -- `vdb` registers an entry under this path and `installed` reads one \
back -- and a spelling that moved in one alone would register packages where \
the layer will not find them, so resolution would report a populated root as \
empty and install every dependency it already had."""

