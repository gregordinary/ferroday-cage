# The census `tools/check-idioms.py` holds the tree to.
#
# Each idiom below is a concept the workspace answers once. The sites are where
# the shape occurs today, each with the reason it is there: one of them is the
# answer, and any other says why the answer does not cover it. A change to this
# file is how a second answer gets decided rather than merely written.
#
# `pattern` is a Python regular expression, matched against each crate's `src`
# and `examples` trees with every test-only item and every comment removed
# (`tools/rust_source.py` is that reading).
#
# What is deliberately not here: a concept clippy can name as a method. Those
# live in `clippy.toml`, which refuses them at the call rather than counting
# them afterwards, and `rustix::fs::openat2` is the worked example.

[[idiom]]
name = "a deadline from a duration"
# A regular expression cannot see a type, so the shape is matched on either
# side of the `+` by the names the workspace gives the two: a clock reading
# (`Instant::now()`, or a local `now` or `since`), or a duration (a `Duration`
# constructor, or a named deadline, timeout, interval or backoff constant).
# `+=` is matched as well as `+`: a deadline moved on by a duration is the same
# addition.
pattern = '(?:Instant::now\(\)|\bnow|\bsince) \+=? |\+=? (?:Duration::|[A-Z][A-Z0-9_]*(?:DEADLINE|TIMEOUT|INTERVAL|BACKOFF)\b)'
answer = """\
`Instant::now().checked_add(d)`, and a duration the clock cannot express is no \
deadline at all. The addition panics on overflow, and every timeout this \
workspace takes is a caller's number: `Running::wait_timeout`, `--timeout`, \
and `HttpFetch::request_timeout` all read an inexpressible one as a wait \
without a bound rather than a panic."""

[[idiom.site]]
path = "crates/ferroday-cage/src/netstack/tcp.rs"
count = 3
why = """\
A TCP flow's own deadlines: `ESTABLISH_DEADLINE` (30 seconds) and \
`DRAIN_DEADLINE` (the stack's idle timeout, minutes) added to a reading of \
the monotonic clock. Both are constants of the stack's own rather than a \
caller's number, and no duration that short can carry the clock past what it \
expresses."""

[[idiom]]
name = "the kernel's retry-the-walk answer"
pattern = 'Errno::AGAIN\) => continue'
answer = """\
`mechanism::resolve::openat2`, which loops on it once for every caller, post-fork \
included. A scoped `openat2` answers `EAGAIN` when a rename or a mount raced \
the walk, meaning "ask again"; a caller that takes it for a failure reports a \
tree as unusable, or fails a launch, because something moved underneath it."""

