[[idiom]]
name = "splitting a path on its separators"
pattern = "split\\(\\|by?t?e?\\| \\*by?t?e? == b'/'\\)"
answer = """\
`path::tree_components` for a path that names something inside a tree, and \
`path::is_ordinary_component` for what it leaves behind. Both refuse `..`, a \
NUL, and the shapes that are not a name; a hand-rolled split decides those \
again, and the two reviews found four splits that had decided them \
differently."""

[[idiom.site]]
path = "crates/ferroday-cage/src/path.rs"
count = 1
why = "The answer."

[[idiom.site]]
path = "crates/ferroday-cage/src/provision/containment.rs"
count = 1
why = """\
A symbolic link's target, which `copy_up` resolves through an overlay's merged \
view the way the kernel resolves one: `..` climbs and a leading `/` restarts at \
the root, where `tree_components` refuses both, since a name a caller hands in \
has no business holding them and a link's target routinely does."""

