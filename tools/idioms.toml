[[idiom]]
name = "a write whose zero-byte case is decided inline"
# Anchored on the `match` over a write with an `Ok(0)` arm directly under it,
# which is what a hand-rolled short-write loop looks like whatever it does with
# the zero.
pattern = 'io::write\([^\n]*\) \{\n\s+Ok\(0\)'
answer = """\
`mechanism::frame::write_full`, which loops over short writes, retries `EINTR`, \
and reports a zero-byte write on a descriptor that is neither full nor closed \
as the anomaly it is. Its byte-level readers and writers serve any descriptor, \
not only the framed protocol between a helper child and its caller."""

