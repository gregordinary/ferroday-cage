[[idiom]]
name = "splitting a path on its separators"
# Every spelling of a split at a `/`: a byte slice's closure, whatever it names
# its byte, and a string's `split`, `rsplit`, `splitn` and `split_once`. A
# regular expression cannot tell a path from any other value written with a
# `/`, so a CIDR or a Gentoo `category/name` is a site too, recorded as what it
# is.
pattern = '''\b(?:r?split|split_terminator|split_inclusive|r?splitn|r?split_once)\((?:\w+, )?(?:'/'|"/"|\|&?\w+\| \*?\w+ == b?'/')\)'''
answer = """\
`path::tree_components` for a path that names something inside a tree, and \
`path::is_ordinary_component` for what it leaves behind. Both refuse `..`, a \
NUL, and the shapes that are not a name; a hand-rolled split decides those \
again, and two splits that decide them differently admit different paths."""

