[[idiom]]
name = "reading a nameserver out of a resolv.conf"
pattern = 'strip_prefix\("nameserver"\)'
answer = """\
Neither site, which is why this entry exists. The library composes no \
`resolv.conf` and so owns no answer, and the two that ask the question are in \
different crates with no way to share one. What the record buys is that a \
change to either arrives as a diff naming the other: the rule they must agree \
on is glibc's, where the keyword and its value are separated by whitespace and \
a line running them together is ignored, and a review found them already \
disagreeing about exactly that."""

