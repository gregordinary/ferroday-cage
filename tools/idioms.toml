name = "an openat2 that does not go through the retry"
pattern = '(?<!resolve::)(?<!fn )\bopenat2\('
answer = """\
`mechanism::resolve::openat2`, or `provision::containment::open_dir` for a \
directory in a tree being provisioned. `clippy.toml` refuses the direct call, \
and this counts the sites that silence it: a direct call under \
`RESOLVE_IN_ROOT` or `RESOLVE_BENEATH` fails whenever a rename or a mount \
anywhere on the host races a `..` step of the walk, which a launch with a \
mount target such as `etc/resolv.conf -> ../run/...` meets in ordinary use."""

