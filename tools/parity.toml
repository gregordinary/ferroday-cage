# What each public builder setting is spelled as on the command line.
#
# `fcage` is a consumer of the library and nothing else, and its help, its
# README, and the guide all say what it covers. A test that reads the CLI's own
# `FLAGS` table cannot check that: a library method absent from the table is
# absent from both sides of the comparison. This file is the other side --
# every configuration method the committed public API records, against the flag
# that reaches it or the reason no flag does.
#
# `tools/check-parity.py` compares it against `crates/ferroday-cage/public-api.txt`
# and the CLI's flag table, and fails on any difference. A new builder method
# therefore arrives with a flag, or with a recorded reason it has none, in a diff
# a reviewer can see.
#
# `kind` says why a setting has no flag:
#
#   code       The setting takes executable behavior -- a trait object, an open
#              descriptor. An argument cannot carry one.
#   positional The setting is spelled somewhere other than a flag: the command
#              line after `--`, or a shell facility.
#   library    A capability `fcage` does not offer at all. The reason says what
#              the tool would have to grow first.
#
# A setting is a method that takes its builder by value and returns it. A
# constructor, a terminal such as `build`, an accessor, and a trait impl have
# other shapes and are not recorded. Every public type with a setting is a
# builder, and the checker fails on one this file does not name.
#
# A builder's flags are ones a launch takes, unless the builder names the mode
# it belongs to with `mode`, a `Mode` variant of the CLI's flag table. Such a
# builder's flags are its mode's own or a launch's, since a mode's parser takes
# a few launch flags, such as `--identity-map`, as well as its own.

# The launch builder. This is the surface the documentation's parity claim is
# about, and every setting on it is spelled here.
