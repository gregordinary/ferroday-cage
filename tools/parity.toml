# What each public builder setting is spelled as on the command line.
#
# `fcage` is a consumer of the library and nothing else, and its help, its
# README, and the guide all say what it covers. A test that reads the CLI's own
# `FLAGS` table cannot check that: a library method absent from the table is
# absent from both sides of the comparison. This file is the other side --
# every configuration method the committed public API records, against the flag
# that reaches it or the reason no flag does.
#
# `tools/check-parity.py` compares it against `crates/ferroday-cage/public-api.txt`
# and the CLI's flag table, and fails on any difference. A new builder method
# therefore arrives with a flag, or with a recorded reason it has none, in a diff
# a reviewer can see.
#
# `kind` says why a setting has no flag:
#
#   code       The setting takes executable behavior -- a trait object, an open
#              descriptor. An argument cannot carry one.
#   positional The setting is spelled somewhere other than a flag: the command
#              line after `--`, or a shell facility.
#   library    A capability `fcage` does not offer at all. The reason says what
#              the tool would have to grow first.
#
# Accessors (`get_*`), `build`, and the trait impls are not settings and are not
# recorded; the checker skips them.

# The launch builder. This is the surface the documentation's parity claim is
# about, and every setting on it is spelled here.
[[builder]]
name = "CageBuilder"
path = "ferroday_cage::CageBuilder"

[[builder.setting]]
name = "rootfs"
flags = ["--rootfs"]

[[builder.setting]]
name = "overlay"
flags = ["--overlay-lower", "--overlay-upper", "--overlay-work"]

[[builder.setting]]
name = "overlay_rootfs"
flags = ["--rootfs", "--overlay-upper", "--overlay-work"]
why = "The shorthand for an overlay over one lower directory, which the trio spells by naming --rootfs as that directory."

[[builder.setting]]
name = "bind"
flags = ["--bind"]

[[builder.setting]]
name = "bind_ro"
flags = ["--ro-bind"]

[[builder.setting]]
name = "raw_mount"
flags = ["--raw-mount"]

[[builder.setting]]
name = "managed_mounts"
flags = ["--managed-mounts", "--no-managed-mounts"]

[[builder.setting]]
name = "mount_proc"
flags = ["--proc", "--no-proc"]

[[builder.setting]]
name = "mount_dev"
flags = ["--dev", "--no-dev"]

[[builder.setting]]
name = "mount_tmp"
flags = ["--tmp", "--no-tmp"]

[[builder.setting]]
name = "resolv_conf"
flags = ["--resolv-conf", "--no-resolv-conf"]

[[builder.setting]]
name = "command"
kind = "positional"
why = "The command line after `--`, which is where a shell already writes one."

[[builder.setting]]
name = "arg"
kind = "positional"
why = "The command line after `--`."

[[builder.setting]]
name = "args"
kind = "positional"
why = "The command line after `--`."

[[builder.setting]]
name = "clear_args"
kind = "positional"
why = "A command line given alongside a profile replaces the profile's command and its arguments together, which is this call."

[[builder.setting]]
name = "current_dir"
flags = ["--chdir"]

[[builder.setting]]
name = "env"
flags = ["--setenv"]

[[builder.setting]]
name = "envs"
flags = ["--setenv"]

[[builder.setting]]
name = "base_env"
flags = ["--base-env", "--no-base-env"]

[[builder.setting]]
name = "path_lookup"
flags = ["--path-lookup", "--no-path-lookup"]

[[builder.setting]]
name = "hostname"
flags = ["--hostname"]

[[builder.setting]]
name = "network"
flags = ["--share-net", "--isolate-net", "--deny-net"]

[[builder.setting]]
name = "pid_namespace"
flags = ["--pid-ns", "--share-pid"]

[[builder.setting]]
name = "identity_map"
flags = ["--identity-map"]

[[builder.setting]]
name = "id_mapper"
kind = "code"
why = "An identity-map delegate is a trait object. `--identity-map` names the delegates the library bundles."

[[builder.setting]]
name = "run_as"
flags = ["--run-as"]

[[builder.setting]]
name = "rlimit"
flags = ["--rlimit"]

[[builder.setting]]
name = "seccomp"
flags = [
    "--seccomp",
    "--seccomp-allow",
    "--seccomp-deny",
    "--seccomp-allow-rule",
    "--seccomp-deny-rule",
]

[[builder.setting]]
name = "landlock_fs"
flags = ["--landlock-ro", "--landlock-rw"]

[[builder.setting]]
name = "landlock_net"
flags = ["--landlock-bind", "--landlock-connect"]

[[builder.setting]]
name = "drop_all_capabilities"
flags = ["--drop-caps"]

[[builder.setting]]
name = "keep_capabilities"
flags = ["--keep-caps"]

[[builder.setting]]
name = "stdin"
flags = ["--stdin"]
why = "The unit dispositions only. `Stdio::Fd` hands the command an open descriptor, which no argument carries."

[[builder.setting]]
name = "stdout"
kind = "positional"
why = "A shell already spells both dispositions, and a profile carries `stdout` where a run wants it recorded."

[[builder.setting]]
name = "stderr"
kind = "positional"
why = "As `stdout`."

[[builder.setting]]
name = "stop_with_caller"
flags = ["--stop-with-caller", "--no-stop-with-caller"]

