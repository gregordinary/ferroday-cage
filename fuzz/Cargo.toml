[package]
name = "ferroday-cage-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferroday-cage = { path = "../crates/ferroday-cage", features = ["netstack", "tarball", "debian", "alpine", "gentoo"] }

# A workspace of its own, so the fuzzing harness never joins the library's
# build.
[workspace]
members = ["."]

[[bin]]
name = "dns_query"
path = "fuzz_targets/dns_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_hello"
path = "fuzz_targets/client_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_head"
path = "fuzz_targets/http_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tar_archive"
path = "fuzz_targets/tar_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gentoo_dependencies"
path = "fuzz_targets/gentoo_dependencies.rs"
test = false
doc = false
bench = false

[[bin]]
