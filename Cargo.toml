[workspace]
resolver = "3"
members = [
    "crates/ferroday-cage",
    "crates/ferroday-cage-cli",
    "crates/ferroday-cage-testkit",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gregordinary/ferroday-cage"
homepage = "https://gregordinary.github.io/ferroday-cage/"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
# The post-fork async-signal-safety guard in ferroday-cage::mechanism keys on
# the same build cfgs rustix reads to select its backend. Declare them so the
# unexpected-cfg lint stays quiet on a normal build, where neither is set.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(rustix_use_libc)',
    'cfg(rustix_no_linux_raw)',
] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# `clippy.toml` lists the primitives the workspace answers once. Denied rather
# than left at its default warning, so reaching past one of those answers fails
# a plain `cargo clippy` and not only CI's `-D warnings`.
disallowed_methods = "deny"
